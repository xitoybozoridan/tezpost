<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4DB5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>TezPost Cargo</title>
<style>
  :root{
    --blue:#0B4DB5; --blue-deep:#052F7A; --blue-soft:#E8F0FD;
    --orange:#FF7A00; --orange-dark:#E56A00; --orange-soft:#FFF1E3;
    --bg:#F2F6FC; --card:#FFFFFF; --text:#0E1B3D; --muted:#6B7A99; --line:#DCE5F4; --danger:#D92D20;
    --shadow:0 6px 22px rgba(11,77,181,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .screen{display:none;min-height:100vh;max-width:520px;margin:0 auto;position:relative}
  .screen.active{display:block;animation:in .28s ease both}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pad-nav{padding-bottom:calc(env(safe-area-inset-bottom) + 96px)}

  /* ---------- Yuqori ko'k qism ---------- */
  .hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#0B4DB5 0%,#073A94 55%,#052F7A 100%);
    border-radius:0 0 34px 34px;padding:calc(env(safe-area-inset-top) + 18px) 18px 26px;box-shadow:0 12px 30px rgba(5,47,122,.28)}
  .hero::before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-80px;top:-90px;background:radial-gradient(circle,rgba(255,122,0,.45),rgba(255,122,0,0) 70%)}
  .hero::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;left:-70px;bottom:-110px;background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 70%)}
  .hero>*{position:relative;z-index:1}
  .brand{background:#fff;border-radius:24px;padding:12px 16px;display:flex;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.18)}
  .brand img{width:100%;max-width:330px;height:auto;display:block}
  .hello{margin:14px 4px 0;color:rgba(255,255,255,.85);font-size:15px}
  .hello b{color:#fff;font-size:17px}
  .punkt{margin-top:12px;display:flex;align-items:center;gap:12px;padding:12px;border-radius:22px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .pin{width:48px;height:48px;border-radius:16px;background:var(--orange);display:grid;place-items:center;flex:none;box-shadow:0 6px 14px rgba(255,122,0,.45)}
  .pin svg{width:24px;height:24px;fill:#fff}
  .punkt-text{min-width:0}
  .punkt-text small{display:block;font-size:13px;color:rgba(255,255,255,.78)}
  .punkt-text b{display:block;font-size:19px;color:#fff;letter-spacing:.3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bell{margin-left:auto;width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
  .bell svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .cta{margin-top:16px;width:100%;height:66px;border:0;border-radius:33px;background:linear-gradient(180deg,#FF9322,#FF7A00 60%,#F26A00);color:#fff;font-size:20px;font-weight:700;letter-spacing:.2px;
    display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 10px 24px rgba(255,122,0,.5),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s}
  .cta:active{transform:scale(.985)}
  .cta .plus{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--orange);display:grid;place-items:center;font-size:28px;line-height:1;font-weight:600}

  .section{padding:26px 18px 20px}
  .section-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .section-head h2{margin:0;font-size:22px;letter-spacing:-.2px}
  .count{min-width:28px;height:28px;padding:0 9px;border-radius:14px;background:var(--blue);color:#fff;font-size:14px;font-weight:700;display:grid;place-items:center}
  .count.zero{background:var(--line);color:var(--muted)}

  .empty{background:var(--card);border-radius:28px;padding:30px 22px;text-align:center;box-shadow:var(--shadow)}
  .empty svg{width:96px;height:96px;margin:0 auto 10px;display:block}
  .empty b{display:block;font-size:18px}
  .empty p{margin:6px 0 0;color:var(--muted);font-size:15px;line-height:1.45}
  .skel{height:92px;border-radius:24px;margin-bottom:12px;background:linear-gradient(90deg,#E6EDF9 25%,#F3F7FD 50%,#E6EDF9 75%);background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}

  .item{background:var(--card);border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:flex-start;animation:in .3s ease both}
  .item .ic{width:48px;height:48px;border-radius:16px;background:var(--blue-soft);display:grid;place-items:center;flex:none}
  .item .ic svg{width:26px;height:26px}
  .item .body{min-width:0;flex:1}
  .item .top{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .item .trk{font-weight:800;font-size:18px;letter-spacing:.6px;word-break:break-all}
  .st{flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .st.new{background:var(--blue-soft);color:var(--blue)}
  .st.china{background:var(--orange-soft);color:#B24F00}
  .st.transit{background:#FFF4CC;color:#8A6500}
  .st.uz{background:#E3F6EC;color:#127A45}
  .st.pickup{background:#D9F1F4;color:#0A6670}
  .st.done{background:#127A45;color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{background:var(--orange-soft);color:#B24F00;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px}
  .item .when{margin-top:9px;font-size:13px;color:var(--muted)}
  .note-line{margin-top:6px;font-size:14px;color:#44527a}

  /* ---------- Kirish ---------- */
  .auth-card{margin:-18px 18px 30px;position:relative;z-index:2;background:var(--card);border-radius:30px;padding:22px 20px 24px;box-shadow:0 14px 34px rgba(11,77,181,.16)}
  .tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--blue-soft);border-radius:18px;padding:5px;margin-bottom:20px}
  .tabs button{border:0;background:none;padding:12px 6px;border-radius:14px;font-weight:700;font-size:16px;color:var(--muted)}
  .tabs button.on{background:#fff;color:var(--blue);box-shadow:0 3px 10px rgba(11,77,181,.15)}
  .auth-card h1{font-size:26px;margin:0 0 4px;letter-spacing:-.4px}
  .auth-card p.sub{margin:0 0 18px;color:var(--muted);font-size:15px}
  .msg{min-height:20px;margin:2px 4px 12px;color:var(--danger);font-size:14px;font-weight:600}
  .phone-wrap{display:flex;align-items:center;gap:8px}
  .phone-wrap .pre{font-weight:700;font-size:19px;color:var(--text);padding-top:4px}
  .eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;background:none;display:grid;place-items:center}
  .eye svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .field.has-eye input{padding-right:44px}
  .setup{margin:0 18px 14px;background:#FFF4CC;color:#8A6500;border-radius:16px;padding:12px 14px;font-size:14px;font-weight:600}

  /* ---------- Profil ---------- */
  .p-hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#0B4DB5 0%,#073A94 55%,#052F7A 100%);border-radius:0 0 34px 34px;padding:calc(env(safe-area-inset-top) + 30px) 18px 34px;text-align:center;color:#fff;box-shadow:0 12px 30px rgba(5,47,122,.28)}
  .p-hero::before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-80px;top:-90px;background:radial-gradient(circle,rgba(255,122,0,.45),rgba(255,122,0,0) 70%)}
  .p-hero>*{position:relative}
  .avatar{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(180deg,#FF9322,#F26A00);display:grid;place-items:center;font-size:36px;font-weight:800;border:4px solid rgba(255,255,255,.85);box-shadow:0 10px 24px rgba(0,0,0,.25)}
  .p-hero h1{margin:0;font-size:26px;letter-spacing:-.3px}
  .p-hero .ph{margin-top:6px;color:rgba(255,255,255,.82);font-size:16px;letter-spacing:.3px}
  .stats{display:flex;justify-content:center;gap:12px;margin-top:18px}
  .stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:10px 20px;min-width:120px}
  .stat b{display:block;font-size:22px}
  .stat span{font-size:13px;color:rgba(255,255,255,.8)}
  .menu{margin:22px 18px 0;background:var(--card);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
  .menu button{width:100%;display:flex;align-items:center;gap:14px;padding:16px 18px;border:0;background:none;text-align:left;font-size:17px;font-weight:600;border-bottom:1px solid var(--line)}
  .menu button:last-child{border-bottom:0}
  .menu button:active{background:#F7FAFF}
  .menu .mi{width:42px;height:42px;border-radius:14px;background:var(--blue-soft);display:grid;place-items:center;flex:none}
  .menu .mi svg{width:22px;height:22px;stroke:var(--blue);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .menu .arrow{margin-left:auto;color:var(--muted);font-size:22px}
  .menu .danger{color:var(--danger)}
  .menu .danger .mi{background:#FDECEA}
  .menu .danger .mi svg{stroke:var(--danger)}
  .ver{text-align:center;color:var(--muted);font-size:13px;margin:22px 0}

  /* ---------- Pastki menyu ---------- */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:8;display:none}
  .nav.show{display:block}
  .nav .in{max-width:520px;margin:0 auto;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -8px 28px rgba(11,77,181,.14);display:grid;grid-template-columns:1fr 1fr;padding:8px 14px calc(env(safe-area-inset-bottom) + 8px)}
  .nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;color:var(--muted);font-size:13px;font-weight:600;position:relative}
  .nav button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .nav button.on{color:var(--blue)}
  .nav button.on::after{content:"";position:absolute;top:-8px;width:34px;height:4px;border-radius:0 0 4px 4px;background:var(--orange)}

  /* ---------- Deklaratsiya ---------- */
  .bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 18px 8px;background:rgba(242,246,252,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .link{background:none;border:0;font-size:18px;padding:10px 0;font-weight:600}
  .link.back{color:var(--blue);display:flex;align-items:center;gap:2px}
  .link.back svg{width:22px;height:22px;stroke:var(--blue);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .link.save{color:var(--orange-dark)}
  h1.title{font-size:34px;line-height:1.1;margin:6px 20px 18px;letter-spacing:-.6px}
  .form{padding:0 18px 130px}

  .field{display:block;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:11px 16px 12px;margin-bottom:14px;position:relative;transition:border-color .15s,box-shadow .15s}
  .field:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(11,77,181,.12)}
  .field>span{display:block;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.2px}
  .field input,.field select,.field textarea{width:100%;border:0;background:transparent;outline:none;font-size:19px;padding:4px 0 0;appearance:none;-webkit-appearance:none}
  .field input::placeholder{color:#B3BDD3}
  .field.err{border-color:var(--danger);box-shadow:0 0 0 4px rgba(217,45,32,.10);animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .field.sel::after{content:"";position:absolute;right:20px;top:50%;width:9px;height:9px;border-right:2.5px solid var(--blue);border-bottom:2.5px solid var(--blue);transform:translateY(-70%) rotate(45deg);pointer-events:none}
  #track{font-weight:700;letter-spacing:1px}

  .pcard{background:var(--card);border-radius:28px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);animation:in .25s ease both}
  .pcard .field{background:#F7FAFF}
  .phead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .badge{width:34px;height:34px;border-radius:12px;background:var(--orange);color:#fff;font-weight:800;display:grid;place-items:center;font-size:17px;box-shadow:0 5px 12px rgba(255,122,0,.35)}
  .phead h3{margin:0;font-size:20px}
  .rm{margin-left:auto;background:#FDECEA;color:var(--danger);border:0;border-radius:12px;padding:7px 12px;font-size:14px;font-weight:600}
  .lbl{font-size:13px;font-weight:600;color:var(--muted);margin:2px 4px 8px;letter-spacing:.2px}
  .stepper{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .stepper button{width:56px;height:56px;border-radius:18px;border:1.5px solid var(--line);background:#F7FAFF;color:var(--blue);font-size:28px;font-weight:600;line-height:1;display:grid;place-items:center}
  .stepper button:active{background:var(--blue-soft)}
  .stepper input{flex:1;min-width:0;height:56px;text-align:center;border:1.5px solid var(--line);border-radius:18px;background:#fff;font-size:22px;font-weight:700;outline:none;-moz-appearance:textfield}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .stepper input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(11,77,181,.12)}
  .add{width:100%;height:58px;border-radius:20px;border:2px dashed var(--orange);background:var(--orange-soft);color:var(--orange-dark);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
  .add:active{background:#FFE3C7}
  .add span{font-size:26px;line-height:1}
  .area-lbl{font-size:16px;font-weight:700;margin:8px 4px 10px}
  textarea{min-height:120px;resize:none;font-size:17px !important;line-height:1.45}

  .savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:16px 18px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(180deg,rgba(242,246,252,0),var(--bg) 38%)}
  .savebar .in{max-width:520px;margin:0 auto}
  .btn-save{width:100%;height:62px;border:0;border-radius:31px;background:linear-gradient(180deg,#1760D6,#0B4DB5 60%,#093F96);color:#fff;font-size:19px;font-weight:700;box-shadow:0 10px 24px rgba(11,77,181,.4),inset 0 1px 0 rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;gap:10px}
  .btn-save:active{transform:scale(.985)}
  .btn-save[disabled]{opacity:.75}
  .btn-save .sp{width:20px;height:20px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  .btn-orange{background:linear-gradient(180deg,#FF9322,#FF7A00 60%,#F26A00);box-shadow:0 10px 24px rgba(255,122,0,.45),inset 0 1px 0 rgba(255,255,255,.35)}
  .auth-card .btn-save{height:58px;border-radius:29px;margin-top:4px}

  /* ---------- Pastdan chiqadigan oyna ---------- */
  .sheet-back{position:fixed;inset:0;background:rgba(5,20,60,.45);z-index:30;display:none;align-items:flex-end;justify-content:center}
  .sheet-back.show{display:flex;animation:fade .2s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{width:100%;max-width:520px;background:var(--bg);border-radius:30px 30px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .25s ease both}
  @keyframes up{from{transform:translateY(40px)}to{transform:none}}
  .sheet h3{margin:0 0 14px;font-size:22px}
  .sheet .btn-save{margin-top:4px}
  .sheet .cancel{width:100%;border:0;background:none;padding:14px;color:var(--muted);font-weight:600;font-size:16px}

  .toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--blue-deep);color:#fff;padding:14px 22px;border-radius:22px;font-size:16px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:40;width:max-content;max-width:90vw;text-align:center;box-shadow:0 10px 24px rgba(5,47,122,.35)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.bad{background:var(--danger)}

  /* ---------- IXCHAM ko'rinish ---------- */
  .pad-nav{padding-bottom:calc(env(safe-area-inset-bottom) + 70px)}
  .hero{padding:calc(env(safe-area-inset-top) + 12px) 14px 16px;border-radius:0 0 26px 26px}
  .brand{padding:7px 12px;border-radius:18px}
  .brand img{max-width:230px}
  .hello{margin:10px 4px 0;font-size:13px}.hello b{font-size:15px}
  .punkt{margin-top:10px;padding:8px 10px;gap:10px;border-radius:16px}
  .pin{width:38px;height:38px;border-radius:12px}.pin svg{width:20px;height:20px}
  .punkt-text small{font-size:11px}.punkt-text b{font-size:15px;margin-top:1px}
  .bell{width:38px;height:38px;border-radius:12px}.bell svg{width:20px;height:20px}
  .cta{margin-top:12px;height:50px;border-radius:25px;font-size:16px;gap:10px}
  .cta .plus{width:28px;height:28px;font-size:22px}
  .section{padding:18px 14px 14px}
  .section-head{margin-bottom:10px}.section-head h2{font-size:18px}
  .count{min-width:24px;height:24px;font-size:12px;border-radius:12px}
  .empty{border-radius:22px;padding:22px 18px}.empty svg{width:72px;height:72px}.empty b{font-size:16px}.empty p{font-size:13px}
  .skel{height:70px;border-radius:18px;margin-bottom:10px}
  .item{padding:11px 12px;border-radius:18px;margin-bottom:9px;gap:10px}
  .item .ic{width:38px;height:38px;border-radius:12px}.item .ic svg{width:21px;height:21px}
  .item .trk{font-size:15px;letter-spacing:.4px}
  .st{font-size:11px;padding:3px 9px}
  .chips{gap:5px;margin-top:6px}.chip{font-size:12px;padding:3px 8px}
  .item .when{margin-top:7px;font-size:12px}.note-line{font-size:13px;margin-top:4px}
  .auth-card{margin:-16px 14px 24px;padding:16px 16px 18px;border-radius:24px}
  .tabs{padding:4px;margin-bottom:14px;border-radius:15px}.tabs button{padding:9px 6px;font-size:14px;border-radius:12px}
  .auth-card h1{font-size:21px}.auth-card p.sub{font-size:13px;margin-bottom:12px}
  .field{padding:8px 14px 9px;border-radius:15px;margin-bottom:10px}
  .field>span{font-size:12px}.field input,.field select,.field textarea{font-size:16px;padding:3px 0 0}
  .phone-wrap .pre{font-size:16px;padding-top:3px}
  .auth-card .btn-save{height:48px;border-radius:24px;font-size:16px}
  .p-hero{padding:calc(env(safe-area-inset-top) + 20px) 14px 22px;border-radius:0 0 26px 26px}
  .avatar{width:70px;height:70px;font-size:27px;margin-bottom:10px;border-width:3px}
  .p-hero h1{font-size:21px}.p-hero .ph{font-size:14px;margin-top:4px}
  .stats{margin-top:12px}.stat{padding:7px 16px;min-width:100px;border-radius:14px}.stat b{font-size:18px}.stat span{font-size:12px}
  .menu{margin:16px 14px 0;border-radius:20px}
  .menu button{padding:11px 14px;font-size:15px;gap:12px}
  .menu .mi{width:34px;height:34px;border-radius:11px}.menu .mi svg{width:18px;height:18px}
  .ver{font-size:12px;margin:16px 0}
  .nav .in{border-radius:20px 20px 0 0;padding:5px 12px calc(env(safe-area-inset-bottom) + 5px)}
  .nav button{font-size:11px;gap:2px;padding:5px 0}.nav button svg{width:22px;height:22px}
  .nav button.on::after{top:-5px;width:28px;height:3px}
  .bar{padding:calc(env(safe-area-inset-top) + 4px) 14px 4px}.link{font-size:16px;padding:8px 0}
  h1.title{font-size:25px;margin:4px 16px 12px}
  .form{padding:0 14px 110px}
  .pcard{padding:14px;border-radius:20px;margin-bottom:12px}
  .phead{margin-bottom:11px;gap:10px}.badge{width:28px;height:28px;border-radius:10px;font-size:14px}.phead h3{font-size:16px}

<script src="config.js"></script>
<script>
/* ====== SOZLAMALAR ====== */
const CONFIG = {
  url: (window.TP_CONFIG||{}).url || "",
  key: (window.TP_CONFIG||{}).key || "",
  punkt: "PUNKTNI TANLANG",
  productTypes: ["Kiyim","Poyabzal","Elektronika","Aksessuarlar","Uy-ro'zg'or buyumlari","Kosmetika","O'yinchoqlar","Avto ehtiyot qismlar","Boshqa"]
};
const CONFIGURED = !!(CONFIG.url && CONFIG.key);
const STATUS = {new:"Yangi", china:"Xitoy omborida", transit:"Yo'lda", uz:"O'zbekistonda", pickup:"Topshirish punktida", done:"Tasdiqlangan"};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v) }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} },
  del(k){ try{ localStorage.removeItem(k) }catch(e){} }
};

/* ====== Server bilan aloqa ====== */
async function rpc(name, args){
  let res;
  try{
    res = await fetch(CONFIG.url + "/rest/v1/rpc/" + name, {
      method: "POST",
      headers: { "apikey": CONFIG.key, "Content-Type": "application/json" },
      body: JSON.stringify(args || {})
    });
  }catch(e){
    const err = new Error("Internet yo'q yoki server javob bermayapti"); err.offline = true; throw err;
  }
  let data = null; try{ data = await res.json() }catch(e){}
  if(!res.ok){
    const msg = (data && data.message) || "Xatolik yuz berdi";
    const err = new Error(msg);
    err.session = /Sessiya tugagan|invalid input syntax for type uuid/i.test(msg);
    throw err;
  }
  return data;
}

let token = store.get("tp_token", null);
let me = store.get("tp_me", null);
let declarations = store.get("tp_decl", []);
let products = [{type:"", qty:1}];
let mode = "login";
let busy = false;

function toast(msg, bad){
  const t = $("toast"); t.textContent = msg; t.classList.toggle("bad", !!bad); t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2400);
}

/* ====== Ekranlar ====== */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active", s.id===id));
  $("nav").classList.toggle("show", id==="home" || id==="profile");
  $("navHome").classList.toggle("on", id==="home");
  $("navProfile").classList.toggle("on", id==="profile");
  window.scrollTo({top:0,left:0,behavior:"instant"});
}
function go(id){ if(id==="profile") renderProfile(); show(id); if(id==="home") loadList(); }
function openDecl(){ resetForm(); show("decl"); }
function closeDecl(){ show("home"); }

/* ====== Kirish / ro'yxatdan o'tish ====== */
function setMode(m){
  mode = m;
  $("tabLogin").classList.toggle("on", m==="login");
  $("tabReg").classList.toggle("on", m==="reg");
  $("nameField").style.display = m==="reg" ? "block" : "none";
  $("authTitle").textContent = m==="reg" ? "Yangi hisob yaratish" : "Xush kelibsiz";
  $("authSub").textContent = m==="reg" ? "Ism, telefon raqam va parol kiriting" : "Telefon raqam va parol bilan kiring";
  $("authBtn").textContent = m==="reg" ? "Ro'yxatdan o'tish" : "Kirish";
  $("aPass").autocomplete = m==="reg" ? "new-password" : "current-password";
  $("authMsg").textContent = "";
}
function toggleEye(btn){
  const i = btn.parentElement.querySelector("input");
  i.type = i.type === "password" ? "text" : "password";
}
function fmtPhoneInput(v){
  const d = v.replace(/\D/g,"").slice(0,9);
  const p = [d.slice(0,2), d.slice(2,5), d.slice(5,7), d.slice(7,9)].filter(Boolean);
  return p.join(" ");
}
$("aPhone").addEventListener("input", e=>{ e.target.value = fmtPhoneInput(e.target.value); });
["aName","aPhone","aPass"].forEach(id=>$(id).addEventListener("keydown", e=>{ if(e.key==="Enter") submitAuth(); }));

function setBusy(btn, on, label){
  busy = on; btn.disabled = on;
  btn.innerHTML = on ? '<span class="sp"></span> Kuting…' : label;
}

async function submitAuth(){
  if(busy) return;
  if(!CONFIGURED){ $("authMsg").textContent = "Server hali ulanmagan"; return; }
  const digits = $("aPhone").value.replace(/\D/g,"");
  const pass = $("aPass").value;
  const name = $("aName").value.trim();
  const msg = $("authMsg"); msg.textContent = "";
  if(mode==="reg" && name.length < 2){ msg.textContent = "Ismingizni kiriting"; return; }
  if(digits.length !== 9){ msg.textContent = "Telefon raqamni to'liq kiriting (9 ta raqam)"; return; }
  if(pass.length < 6){ msg.textContent = "Parol kamida 6 ta belgidan iborat bo'lsin"; return; }
  const label = mode==="reg" ? "Ro'yxatdan o'tish" : "Kirish";
  setBusy($("authBtn"), true, label);
  try{
    const phone = "998" + digits;
    const r = mode==="reg"
      ? await rpc("register_customer", {p_phone:phone, p_password:pass, p_name:name})
      : await rpc("login_customer", {p_phone:phone, p_password:pass});
    if(r && r.error){ msg.textContent = r.error; return; }
    token = r.token; me = {name:r.name, phone:r.phone};
    store.set("tp_token", token); store.set("tp_me", me);
    declarations = []; store.set("tp_decl", []);
    $("aPass").value = "";
    enterApp();
    toast(mode==="reg" ? "Hisob yaratildi" : "Xush kelibsiz");
  }catch(e){ msg.textContent = e.message; }
  finally{ setBusy($("authBtn"), false, label); }
}

function enterApp(){
  $("helloName").textContent = (me && me.name || "").split(" ")[0];
  $("punktName").textContent = CONFIG.punkt;
  renderList(); show("home"); loadList();
}
function forceLogout(){
  token = null; me = null; declarations = [];
  store.del("tp_token"); store.del("tp_me"); store.del("tp_decl");
  setMode("login"); show("auth");
}
async function logout(){
  const t = token;
  try{ if(t) await rpc("logout_customer", {p_token:t}); }catch(e){}
  forceLogout(); toast("Hisobdan chiqdingiz");
}
function handleErr(e, quiet){
  if(e.session){ forceLogout(); toast("Qaytadan kiring", true); return; }
  if(!quiet) toast(e.message, true);
}

/* ====== Profil ====== */
function fmtPhone(p){
  p = String(p||"");
  return "+998 " + [p.slice(3,5), p.slice(5,8), p.slice(8,10), p.slice(10,12)].filter(Boolean).join(" ");
}
function renderProfile(){
  const n = (me && me.name) || "";
  $("avatar").textContent = n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase() || "?";
  $("pName").textContent = n;
  $("pPhone").textContent = me ? fmtPhone(me.phone) : "";
  $("pCount").textContent = declarations.length;
}

/* ====== Pastdan chiqadigan oyna ====== */
let sheetOk = null;
function openSheet(o){
  $("sheetTitle").textContent = o.title;
  $("sheetBody").innerHTML = o.fields.map(f=>`
    <label class="field ${f.type==='password'?'has-eye':''}"><span>${esc(f.label)}</span>
      <input id="sf_${f.id}" type="${f.type||'text'}" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}" autocomplete="${f.type==='password'?'new-password':'off'}" maxlength="${f.max||60}">
      ${f.type==='password'?'<button type="button" class="eye" aria-label="Ko\'rsatish" onclick="toggleEye(this)"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>':''}
    </label>`).join("");
  $("sheetMsg").textContent = "";
  const ok = $("sheetOk"); ok.disabled = false; ok.textContent = o.ok || "Saqlash";
  sheetOk = async ()=>{
    if(busy) return;
    const vals = {}; o.fields.forEach(f=>vals[f.id] = $("sf_"+f.id).value);
    setBusy(ok, true, o.ok || "Saqlash");
    try{ await o.onOk(vals); closeSheet(); }
    catch(e){ if(e.session){ closeSheet(); handleErr(e); } else $("sheetMsg").textContent = e.message; }
    finally{ setBusy(ok, false, o.ok || "Saqlash"); }
  };
  ok.onclick = ()=>sheetOk();
  $("sheetBack").classList.add("show");
  setTimeout(()=>{ const f = $("sheetBody").querySelector("input"); if(f) f.focus(); }, 120);
}
function closeSheet(){ $("sheetBack").classList.remove("show"); }

function editName(){
  openSheet({title:"Ismni o'zgartirish", ok:"Saqlash",
    fields:[{id:"n", label:"Ism", value:(me&&me.name)||"", placeholder:"Ismingiz"}],
    onOk: async v=>{
      const name = v.n.trim();
      if(name.length < 2) throw new Error("Ismingizni kiriting");
      const r = await rpc("update_profile", {p_token:token, p_name:name});
      me.name = r.name; store.set("tp_me", me);
      $("helloName").textContent = me.name.split(" ")[0];
      renderProfile(); toast("Ism yangilandi");
    }});
}
function editPass(){
  openSheet({title:"Parolni o'zgartirish", ok:"Parolni yangilash",
    fields:[{id:"o", label:"Eski parol", type:"password", max:100},
            {id:"n", label:"Yangi parol", type:"password", placeholder:"Kamida 6 ta belgi", max:100}],
    onOk: async v=>{
      if(v.n.length < 6) throw new Error("Yangi parol kamida 6 ta belgidan iborat bo'lsin");
      await rpc("change_password", {p_token:token, p_old:v.o, p_new:v.n});
      toast("Parol yangilandi");
    }});
}

/* ====== Mahsulotlar ====== */
function renderProducts(){
  $("products").innerHTML = products.map((p,i)=>`
    <div class="pcard">
      <div class="phead"><span class="badge">${i+1}</span><h3>Mahsulot №${i+1}</h3>${products.length>1?`<button class="rm" type="button" onclick="removeProduct(${i})">O'chirish</button>`:""}</div>
      <label class="field sel" id="pf${i}"><span>Mahsulot turi</span>
        <select onchange="setType(${i},this.value)">
          <option value="">Tanlang</option>
          ${CONFIG.productTypes.map(t=>`<option ${p.type===t?"selected":""}>${esc(t)}</option>`).join("")}
        </select>
      </label>
      <div class="lbl">Soni</div>
      <div class="stepper">
        <button type="button" aria-label="Kamaytirish" onclick="step(${i},-1)">−</button>
        <input type="number" min="1" inputmode="numeric" value="${p.qty}" id="q${i}" oninput="setQty(${i},this.value)">
        <button type="button" aria-label="Ko'paytirish" onclick="step(${i},1)">+</button>
      </div>
      ${i===products.length-1?`<button class="add" type="button" onclick="addProduct()"><span>+</span> Yana mahsulot qo'shish</button>`:""}
    </div>`).join("");
}
function setType(i,v){ products[i].type = v; $("pf"+i).classList.remove("err"); }
function setQty(i,v){ products[i].qty = Math.max(1, parseInt(v)||1); }
function step(i,d){ products[i].qty = Math.max(1, products[i].qty + d); $("q"+i).value = products[i].qty; }
function addProduct(){ products.push({type:"",qty:1}); renderProducts(); setTimeout(()=>$("pf"+(products.length-1)).scrollIntoView({behavior:"smooth",block:"center"}),50); }
function removeProduct(i){ products.splice(i,1); renderProducts(); }

function resetForm(){
  products = [{type:"",qty:1}];
  $("track").value = ""; $("note").value = "";
  $("trackField").classList.remove("err");
  renderProducts();
}
$("track").addEventListener("input", e=>{ e.target.value = e.target.value.toUpperCase().replace(/\s/g,""); $("trackField").classList.remove("err"); });

async function saveDecl(){
  if(busy) return;
  const track = $("track").value.trim().toUpperCase();
  const tf = $("trackField");
  if(track.length < 4){ tf.classList.remove("err"); void tf.offsetWidth; tf.classList.add("err"); toast("Trek-kodni kiriting", true); $("track").focus(); return; }
  const bad = products.findIndex(p=>!p.type);
  if(bad > -1){
    const f = $("pf"+bad); f.classList.remove("err"); void f.offsetWidth; f.classList.add("err");
    f.scrollIntoView({behavior:"smooth",block:"center"}); toast("Mahsulot turini tanlang", true); return;
  }
  setBusy($("saveBtn"), true, "Deklaratsiyani saqlash");
  try{
    await rpc("add_declaration", {p_token:token, p_track:track, p_products:products.map(p=>({type:p.type, qty:p.qty})), p_note:$("note").value.trim() || null});
    show("home"); toast("Deklaratsiya saqlandi");
    await loadList();
  }catch(e){ handleErr(e); }
  finally{ setBusy($("saveBtn"), false, "Deklaratsiyani saqlash"); }
}

/* ====== Ro'yxat ====== */
const BOX = '<svg viewBox="0 0 24 24" fill="none" stroke="#0B4DB5" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>';
function when(iso){
  const d = new Date(iso), n = new Date();
  const hm = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  if(d.toDateString() === n.toDateString()) return "Bugun, " + hm;
  return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear()+", "+hm;
}
function renderList(loading){
  const all = declarations;
  const c = $("count"); c.textContent = all.length; c.classList.toggle("zero", !all.length);
  if(loading && !all.length){ $("declList").innerHTML = '<div class="skel"></div><div class="skel"></div>'; return; }
  $("declList").innerHTML = all.length
    ? all.map(d=>`<div class="item"><div class="ic">${BOX}</div><div class="body">
        <div class="top"><div class="trk">${esc(d.track)}</div><span class="st ${esc(d.status)}">${esc(STATUS[d.status]||d.status)}</span></div>
        <div class="chips">${(d.products||[]).map(p=>`<span class="chip">${esc(p.type)} × ${Number(p.qty)||1}</span>`).join("")}</div>
        ${d.note?`<div class="note-line">${esc(d.note)}</div>`:""}
        <div class="when">${when(d.created_at)}</div></div></div>`).join("")
    : `<div class="empty">
        <svg viewBox="0 0 96 96" fill="none"><circle cx="48" cy="48" r="44" fill="#E8F0FD"/>
          <path d="M48 20l24 13.5v27L48 74 24 60.5v-27z" fill="#fff" stroke="#0B4DB5" stroke-width="3" stroke-linejoin="round"/>
          <path d="M24 33.5L48 47l24-13.5M48 47v27" stroke="#0B4DB5" stroke-width="3" stroke-linejoin="round"/>
          <path d="M48 47l24-13.5v10L48 57z" fill="#FF7A00" opacity=".9"/></svg>
        <b>Hozircha deklaratsiya yo'q</b>
        <p>Yuk yuborishdan oldin "Deklaratsiya yaratish" tugmasi orqali trek-kodni qo'shing.</p></div>`;
}
async function loadList(){
  if(!token || !CONFIGURED) return;
  renderList(true);
  try{
    declarations = await rpc("my_declarations", {p_token:token}) || [];
    store.set("tp_decl", declarations);
  }catch(e){ handleErr(e, e.offline); }
  renderList();
  if($("profile").classList.contains("active")) renderProfile();
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && token && $("home").classList.contains("active")) loadList(); });

/* ====== Boshlash ====== */
if(!CONFIGURED) $("setupWarn").style.display = "block";
if(token && me){ enterApp(); } else { setMode("login"); show("auth"); }

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
